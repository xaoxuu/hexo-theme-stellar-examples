topbar:
  brand:
    name: 项目文档
    tagline: 从安装到配置的完整使用旅程
    image:
      src: /assets/brand.webp
  menu:
    - id: wiki
      title: 文档
      icon: default:documents
      url: /
      accent: '#1BCDFC'
    - id: examples
      title: 示例
      icon: default:documents
      url: /examples/
      accent: '#1BCDFC'

leftbar:
  brand:
    name: 项目文档
    tagline: 从安装到配置的完整使用旅程
    image:
      src: /assets/brand.webp
  footer:
    actions:
    - type: link
      icon: default:github
      url: https://github.com/xaoxuu
      title: GitHub

footer:
  sitemap:
    - title: 浏览文档
      items:
        - '[文档首页](/)'
        - '[使用 Stellar 主题的博客](/examples/)'
        - '[更新日志与注意事项](/releases/)'
        - '[复刻本站](/build-this-site/)'
    - title: 写作与维护
      items:
        - '[写好第一篇使用指南](/authoring-guide/)'
        - '[用标签组件组织复杂说明](/content-components/)'
        - '[文档导航与页面地址](/navigation-guide/)'
        - '[发布前，把文档走一遍](/publishing-checklist/)'
    - title: 社区支持
      items:
        - '[探索号 🛰️ 文章分享](/articles/)'
        - '[项目进度和近期计划](/todo/)'
        - '[开发者和社区支持](/contributors/)'




profiles:
  wiki_index:
    path: null
  wiki:
    active_menu: wiki
    topbar:
      enabled: true
      widgets:
        - spacer
        - menu
        - settings
features:
  reveal:
    enabled: true
  card_hover:
    spotlight: true
    tilt: true

appearance:
  preset: flat
