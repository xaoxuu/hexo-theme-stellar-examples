leftbar:
  brand:
    name: 个人知识库
    tagline: 记录、连接并重新发现知识
    image:
      src: /assets/brand.webp
  menu:
    - id: post
      title: 近期发布
      icon: default:documents
      url: /
      accent: '#1BCDFC'
    - id: topic
      title: 专栏
      icon: default:pin
      url: /topic/
      accent: '#F44336'
    - id: archives
      title: 文章归档
      icon: default:calendar
      url: /archives/
      accent: '#7C4DFF'
    - id: wiki
      title: 知识库
      icon: default:documents
      url: /wiki/
      accent: '#3DC550'
footer:
  sitemap:
    - title: 浏览知识库
      items:
        - '[最近文章](/)'
        - '[知识库目录](/wiki/)'
        - '[内容归档](/archives/)'

profiles:
  wiki_index:
    active_menu: wiki
  notebooks:
    active_menu: post
  notebook:
    active_menu: post
  note:
    active_menu: post
  topic:
    active_menu: topic

article:
  listing:
    show_tags: true
  show_reading_time: true
features:
  reveal:
    enabled: true
  card_hover:
    spotlight: true
    tilt: true
appearance:
  preset: glass
