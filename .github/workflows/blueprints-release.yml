name: Publish Blueprint Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag, must equal v + package version
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate requested tag
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "${{ inputs.release_tag }}" = "$expected"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check examples
        run: npm run check

      - name: Build release assets
        run: npm run artifacts

      - name: Require an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.release_tag }}"

      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ inputs.release_tag }}" release/*/*
