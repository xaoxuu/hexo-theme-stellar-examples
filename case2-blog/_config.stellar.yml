leftbar:
  enabled: true
  brand:
    name: 星迹
    tagline: 记录技术、阅读与生活的轨迹
    image:
      src: /assets/brand.webp
  menu:
    - id: post
      title: 文章
      icon: default:documents
      url: /
      # accent: '#1BCDFC'
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
      accent: '#3DC550'
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
      accent: '#FA6400'
    - id: topic
      title: 专栏
      icon: default:pin
      url: /topic/
      accent: '#F44336'
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
      accent: '#7C4DFF'
    - type: search
footer:
  sections:
    - title: 浏览星迹
      items:
        - title: 最近文章
          url: /
        - title: 内容归档
          url: /archives/

profiles:
  wiki_index:
    active_menu: post
  notebook_index:
    active_menu: post
  note_index:
    active_menu: post
  note:
    active_menu: post
  topic:
    active_menu: topic

# 配置博客与专栏文章的展示行为。
article:
  # 设置文章排版风格；可选值为 tech 或 story。
  style: story
  listing:
    show_tags: true
  show_reading_time: true

appearance:
  preset: card
  # 配置主题语义颜色。
  colors:
    primary: hsl(44 96% 55%)
  typography:
    font_family:
      body: '"Courier New", ui-serif, Georgia, "Times New Roman", serif'
      code: 'Monaco, Consolas, system-ui, "Courier New", monospace, sans-serif'
features:
  color_scheme_switch:
    enabled: true

inject:
  head_end: |
    <style>
    @media screen and (max-width: 667px) {
      .post-card.topic .topic-posts { box-sizing: border-box; }
    }
    </style>
