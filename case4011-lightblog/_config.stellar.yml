topbar:
  enabled: true
  brand:
    name: 留白
    tagline: 留一处安静的写作空间
    image:
      src: /assets/brand.webp
  menu:
    - id: post
      title: 阅读
      icon: default:documents
      url: /
      accent: '#73584A'
  widgets:
    - spacer
    - menu
    - settings
leftbar:
  enabled: false
footer:
  sitemap:
    - title: 开始阅读
      items:
        - '[最近文章](/)'
        - '[留一处安静的写作空间](/posts/a-quiet-place-to-write/)'
    - title: 生活随笔
      items:
        - '[给星期天留半天空白](/posts/a-sunday-without-a-schedule/)'
        - '[雨停以后，绕一条远路回家](/posts/a-walk-after-rain/)'
        - '[一张书桌，只放这个季节的东西](/posts/a-desk-for-one-season/)'
    - title: 阅读与笔记
      items:
        - '[清晨阅读札记](/posts/reading-in-the-morning/)'
        - '[把读书笔记写在问题旁边](/posts/notes-in-the-margin/)'
profiles:
  post:
    topbar:
      widgets:
        - spacer
        - menu
        - settings
        - toc
    rightbar:
      widgets: []
  wiki_index:
    active_menu: post
  wiki:
    active_menu: post
    topbar:
      widgets:
        - spacer
        - menu
        - settings
        - toc
    rightbar:
      widgets: []
  notebooks:
    active_menu: post
  notebook:
    active_menu: post
  note:
    active_menu: post
    rightbar:
      widgets: []

article:
  style: story
  paragraph_indent: always
  listing:
    pinned_layout: flat
    card_layout: classic
  show_reading_time: true
  footer:
    show_tags: false

features:
  reveal:
    enabled: false

appearance:
  preset: flat
  typography:
    font_family:
      body: '"Courier New", ui-serif, Georgia, "Times New Roman", serif'
      code: 'Monaco, Consolas, system-ui, "Courier New", monospace, sans-serif'
